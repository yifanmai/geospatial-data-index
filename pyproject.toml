[project]
name = "geospatial-data-index"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yifan Mai", email = "yifan@cs.stanford.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "geojson-validator>=0.7.0",
    "pymongo[srv]>=4.17.0",
    "pystac[validation]>=1.15.2",
    "requests>=2.34.2",
]

[project.scripts]
geospatial-data-index = "geospatial_data_index:main"
shard-catalogs = "geospatial_data_index.scripts.shard_catalogs:shard_catalogs"
crawl-catalog = "geospatial_data_index.scripts.crawl_catalog:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
